version: 2

models:
  - name: fct_channel_roas
    description: "Daily channel performance (first-touch attribution). Source of truth for the dashboard."
    columns:
      - name: event_date
        tests:
          - not_null
      - name: session_count
        tests:
          - not_null
      - name: spend_estimate
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: is_unattributable
        tests:
          - not_null
      - name: revenue_per_session
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - event_date
              - traffic_source
              - traffic_medium